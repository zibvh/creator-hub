<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — creovah</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f7f5f1;color:#181713;font-family:"DM Sans",sans-serif}.top{height:70px;border-bottom:1px solid #e1dcd4;display:flex;align-items:center;justify-content:space-between;padding:0 28px;background:#fff}.brand{font:800 23px Manrope;letter-spacing:-1.5px}.user{font-size:12px;color:#777}.wrap{max-width:1100px;margin:60px auto;padding:0 25px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:800;color:#c8522a}.head{display:flex;justify-content:space-between;align-items:end}.head h1{font:800 42px Manrope;letter-spacing:-2px;margin:12px 0}.new{background:#c8522a;color:#fff;border:0;border-radius:9px;padding:12px 15px;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:35px}.card{background:#fff;border:1px solid #e3ded6;border-radius:13px;padding:22px}.card span{font-size:11px;color:#898279}.card strong{display:block;font:800 28px Manrope;margin-top:8px}.wide{grid-column:1/-1}.wide h2{font:700 18px Manrope}.empty{padding:45px 10px;text-align:center;color:#8a837a}.empty p{font-size:13px}.signout{border:0;background:none;font:600 12px "DM Sans";color:#c8522a;cursor:pointer}.banner{border-radius:10px;padding:14px 18px;font-size:13px;font-weight:600;margin-bottom:20px}.banner.ok{background:#e7f3ea;color:#1f7a3d}.banner.err{background:#fbe9e5;color:#c8522a}.conn-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #edE8E0}.conn-row:last-child{border-bottom:0}.conn-left{display:flex;align-items:center;gap:14px}.conn-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}.conn-icon.ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}.conn-icon.fb{background:#1877f2}.conn-name{font-weight:700;font-size:14px}.conn-sub{font-size:12px;color:#8a837a;margin-top:2px}.conn-btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:12px;cursor:pointer}.conn-btn.connect{background:#181713;color:#fff}.conn-btn.disconnect{background:#f0ece5;color:#181713}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:start;gap:20px;flex-direction:column}.wrap{margin-top:40px}}\n</style></head><body><header class="top"><span class="brand">creovah</span><div class="user"><a href="/settings.html" style="color:#777;margin-right:4px">Settings</a> · <span id="name"></span> · <button class="signout" id="out">Sign out</button></div></header><main class="wrap"><div id="banner"></div><div class="head"><div><span class="eyebrow">Workspace</span><h1>Your publishing home.</h1></div><button class="new">Create content</button></div><div class="grid"><div class="card"><span>Scheduled</span><strong>0</strong></div><div class="card"><span>Published</span><strong>0</strong></div><div class="card"><span>Connected platforms</span><strong id="connected">0</strong></div><div class="card wide"><h2>Connections</h2><div id="connRows"></div></div><div class="card wide"><h2>Upcoming content</h2><div class="empty"><p>Your calendar is clear. Create your first piece of content to start building your queue.</p><button class="new">Add your first post</button></div></div></div></main><script>
const t=localStorage.getItem("creovah_token");
if(!t)location.href="/auth.html";

function renderConnections(user){
  const rows=[
    {key:"instagram",cls:"ig",label:"Instagram",sub:user.connections.instagram.connected?("@"+(user.connections.instagram.igUsername||"connected")):"Publish and manage your Instagram Business account"},
    {key:"facebook",cls:"fb",label:"Facebook",sub:user.connections.facebook.connected?(user.connections.facebook.pageName||"connected"):"Publish to your Facebook Page"}
  ];
  document.getElementById("connRows").innerHTML=rows.map(r=>{
    const connected=user.connections[r.key].connected;
    return `<div class="conn-row"><div class="conn-left"><div class="conn-icon ${r.cls}">${r.label[0]}</div><div><div class="conn-name">${r.label}</div><div class="conn-sub">${r.sub}</div></div></div>${connected?`<button class="conn-btn disconnect" data-platform="${r.key}">Disconnect</button>`:`<button class="conn-btn connect" data-platform="${r.key}">Connect</button>`}</div>`;
  }).join("");
  document.querySelectorAll(".conn-btn.connect").forEach(b=>b.onclick=()=>{
    location.href="/api/connections/facebook/start?token="+encodeURIComponent(t);
  });
  document.querySelectorAll(".conn-btn.disconnect").forEach(b=>b.onclick=async()=>{
    b.disabled=true;
    try{
      const r=await fetch("/api/connections/"+b.dataset.platform+"/disconnect",{method:"POST",headers:{Authorization:"Bearer "+t}});
      const d=await r.json();
      if(d.user){document.getElementById("connected").textContent=Object.values(d.user.socials||{}).filter(Boolean).length;renderConnections(d.user)}
    }catch(e){b.disabled=false}
  });
}

const params=new URLSearchParams(location.search);
const connectStatus=params.get("connect");
if(connectStatus){
  const banner=document.getElementById("banner");
  if(connectStatus==="instagram-success"){banner.innerHTML='<div class="banner ok">Instagram connected successfully.</div>'}
  else if(connectStatus==="facebook-only-success"){banner.innerHTML='<div class="banner ok">Facebook connected. No Instagram Business account was found on that Page.</div>'}
  else{
    const reasons={"denied":"You cancelled the connection request.","session-expired":"That connection request expired — please try again.","no-pages-found":"No Facebook Pages were found on that account.","account-not-found":"Account not found.","unexpected":"Something went wrong connecting your account."};
    banner.innerHTML='<div class="banner err">'+(reasons[params.get("reason")]||"Unable to connect.")+'</div>';
  }
  history.replaceState(null,"","/dashboard.html");
}

fetch("/api/me",{headers:{Authorization:"Bearer "+t}}).then(r=>r.json()).then(d=>{
  if(d.user){
    document.getElementById("name").textContent=d.user.name;
    document.getElementById("connected").textContent=Object.values(d.user.socials||{}).filter(Boolean).length;
    renderConnections(d.user);
  }
}).catch(()=>location.href="/auth.html");

document.getElementById("out").onclick=()=>{localStorage.removeItem("creovah_token");location.href="/"};
</script></body></html>
