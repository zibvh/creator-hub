.editor{padding:22px;border-right:1px solid #eee8e0}.preview-pane{padding:22px;background:#faf7f2}.field{margin-top:16px}.field:first-child{margin-top:0}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #dcd6ce;border-radius:10px;padding:12px;outline:none;background:#fff}.field textarea{min-height:145px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#e8622d;box-shadow:0 0 0 3px #e8622d14}.platforms{display:flex;gap:8px;flex-wrap:wrap}.platform{border:1px solid #ddd8d0;background:#fff;border-radius:9px;padding:9px 11px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px}.platform.on{border-color:#e8622d;background:#f8eee9}.platform i{display:grid}.upload{border:1px dashed #cfc8be;border-radius:12px;padding:16px;cursor:pointer;background:#fcfaf7}.upload-row{display:flex;align-items:center;gap:10px}.upload strong{font-size:12px}.upload small{display:block;color:#8a837a;font-size:11px;margin-top:4px}.media-preview{display:none;margin-top:10px;position:relative}.media-preview.show{display:block}.media-preview img,.media-preview video{width:100%;max-height:270px;object-fit:cover;border-radius:10px;background:#eee}.remove-media{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer}.upload-progress{height:5px;background:#eee7df;border-radius:99px;overflow:hidden;margin-top:10px;display:none}.upload-progress.show{display:block}.upload-progress span{display:block;height:100%;width:0;background:#e8622d}.counter{font-size:11px;color:#8a837a;text-align:right;margin-top:5px}.preview-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.preview-label h3{font:600 18px Fraunces;margin:0}.preview-switch{display:flex;gap:5px;overflow:auto}.preview-switch button{border:1px solid #ddd8d0;background:#fff;border-radius:8px;padding:7px 9px;font-size:11px;cursor:pointer;white-space:nowrap}.preview-switch button.on{border-color:#1c1712;background:#1c1712;color:#fff}.post-preview{background:#fff;border:1px solid #e3ded6;border-radius:13px;overflow:hidden}.pv-head{display:flex;gap:10px;padding:14px}.pv-avatar{width:38px;height:38px;border-radius:50%;background:#e8e1d8;display:grid;place-items:center;flex:0 0 auto}.pv-name{font-weight:700;font-size:13px}.pv-sub{font-size:10px;color:#8a837a;margin-top:3px}.pv-body{padding:0 14px 14px;font-size:13px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.pv-media{width:100%;max-height:300px;object-fit:cover;background:#eee}.pv-actions{border-top:1px solid #eee8e0;padding:11px 14px;display:flex;justify-content:space-between;color:#777;font-size:11px}.pv-platform-note{padding:10px 14px;border-top:1px solid #eee8e0;font-size:10px;color:#8a837a}.composer-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap;padding:16px 22px;border-top:1px solid #eee8e0}.secondary{border:0;background:#f0ece5;border-radius:10px;padding:12px 15px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:8px}.schedule-row{display:none;gap:8px;align-items:end;padding:0 22px 16px}.schedule-row.show{display:flex}.schedule-row .field{flex:1}.error{color:#b42f28;font-size:12px;min-height:18px;margin:8px 22px}.notice-card{width:min(430px,100%);background:#fff;border:1px solid #e3ded6;border-radius:18px;padding:22px;box-shadow:0 24px 80px #0002}.notice-head{display:flex;justify-content:space-between}.notice-icon{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#f8eee9;color:#e8622d}.notice-title{font:700 24px Fraunces;margin-top:18px}.notice-message{font-size:13px;line-height:1.65;color:#6e675f;margin-top:9px;white-space:pre-wrap;word-break:break-word}.notice-action{margin-top:20px;width:100%;border:0;border-radius:10px;padding:12px 15px;background:#1c1712;color:#fff;font-weight:700;cursor:pointer}@medi /* Responsive workspace */
body{overflow-x:hidden}.wrap{width:min(1100px,100%);padding-left:clamp(14px,3vw,25px);padding-right:clamp(14px,3vw,25px)}.grid{min-width:0}.card{min-width:0}.content-item,.content-body{min-width:0}.composer{width:min(980px,calc(100vw - 24px));max-width:980px}.composer-grid{min-width:0}.editor,.preview-pane{min-width:0}.platforms{min-width:0}.platform-empty{width:100%;padding:12px;border:1px dashed #d8d1c8;border-radius:10px;color:#8a837a;font-size:12px;background:#fcfaf7}.pv-media{display:block;max-width:100%}
@media (max-width:1100px){.wrap{margin-top:34px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:1/-1}.head h1{font-size:38px}.composer-grid{grid-template-columns:minmax(0,1fr) minmax(280px,.82fr)}}
@media (max-width:820px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.head{align-items:flex-start}.head h1{font-size:34px}.composer{width:calc(100vw - 20px);max-height:96vh;border-radius:14px}.composer-grid{grid-template-columns:1fr}.editor{border-right:0;border-bottom:1px solid #eee8e0}.preview-pane{padding:16px}.composer-actions{justify-content:stretch;padding:14px}.composer-actions button{flex:1 1 140px}.schedule-row{padding-left:16px;padding-right:16px}.conn-row{align-items:flex-start}.conn-left{min-width:0}.conn-sub{overflow-wrap:anywhere}}
@media (max-width:520px){.top{height:58px;padding:0 12px}.brand{font-size:20px}.wrap{margin-top:24px;padding:0 12px}.head{gap:14px}.head h1{font-size:30px;letter-spacing:-1.3px}.primary{width:100%;justify-content:center}.grid{gap:9px;margin-top:22px}.card{padding:16px;border-radius:11px}.card strong{font-size:25px}.composer{width:calc(100vw - 12px);max-height:98vh;border-radius:12px}.composer-head{padding:14px 15px}.composer-head h2{font-size:21px}.editor{padding:15px}.field{margin-top:13px}.field textarea{min-height:120px}.preview-pane{padding:14px}.preview-label{align-items:flex-start;gap:8px;flex-direction:column}.preview-switch{max-width:100%;width:100%}.preview-switch button{flex:0 0 auto}.composer-actions{gap:6px}.composer-actions button{padding:11px 10px;font-size:12px}.upload{padding:13px}.media-preview img,.media-preview video{max-height:240px}.content-item{padding:12px}.menu-dropdown{right:10px;top:52px;min-width:min(260px,calc(100vw - 20px))}}

<body>
<header class="top"><span class="brand">creovah</span><button class="icon-btn" id="menuBtn" aria-label="Menu"><i data-lucide="menu"></i></button><div class="menu-dropdown" id="menuDropdown"><div class="who" id="menuName"></div><a href="/settings.html"><i data-lucide="settings"></i>Settings</a><a href="/privacy.html"><i data-lucide="shield"></i>Privacy Policy</a><button class="signout" id="out"><i data-lucide="log-out"></i>Sign out</button></div></header>
<main class="wrap"><div class="head"><div><span class="eyebrow">Workspace</span><h1>Publishing</h1></div><button class="primary" id="newPost"><i data-lucide="plus"></i>Create post</button></div>
<div class="grid"><div class="card"><span>Scheduled</span><strong id="scheduledCount">0</strong></div><div class="card"><span>Published</span><strong id="publishedCount">0</strong></div><div class="card"><span>Connected platforms</span><strong id="connected">0</strong></div><div class="card wide"><h2>Content</h2><div id="contentList" class="content-list"></div></div></div></main>

<div class="modal" id="modal"><div class="composer">
<div class="composer-head"><div><span class="eyebrow">Composer</span><h2>Create post</h2></div><button class="icon-btn" id="close" aria-label="Close"><i data-lucide="x"></i></button></div>
<form id="contentForm"><div class="composer-grid"><section class="editor">
<div class="field"><label for="title">Title</label><input id="title" maxlength="120" placeholder="Optional"></div>
<div class="field"><label for="body">Caption</label><textarea id="body" maxlength="5000" placeholder="Write your post"></textarea><div class="counter"><span id="count">0</span>/5000</div></div>
<div class="field"><label>Publish to</label><div class="platforms"></div>
<div class="field"><label>Media</label><label class="upload" for="mediaFile"><div class="upload-row"><i data-lucide="upload"></i><div><strong>Choose photo or video</strong><small>JPG, PNG, GIF or MP4</small></div></div><input id="mediaFile" type="file" accept="image/jpeg,image/png,image/gif,video/mp4" hidden></label><div class="media-preview" id="mediaPreview"><button class="remove-media" id="removeMedia" type="button" aria-label="Remove media"><i data-lucide="x"></i></button><img id="mediaImg" alt=""><video id="mediaVideo" controls playsinline></video></div><div class="upload-progress" id="uploadProgress"><span id="uploadBar"></span></div></div>
<div class="field"><label for="altText">Alt text</label><input id="altText" maxlength="300" placeholder="Optional"></div>
<div class="field" id="scheduleField"><label for="schedule">Schedule</label><input id="schedule" type="datetime-local"></div>
</section><aside class="preview-pane"><div class="preview-label"><h3>Preview</h3><div class="preview-switch" id="previewSwitch"></div></div><div class="post-preview" id="postPreview"></div></aside></div>
<div class="error" id="formError"></div><div class="composer-actions"><button type="button" class="secondary" id="cancel">Cancel</button><button type="button" class="secondary" id="draftBtn"><i data-lucide="file-text"></i>Save draft</button><button type="button" class="secondary" id="scheduleBtn"><i data-lucide="calendar-clock"></i>Schedule</button><button type="button" class="primary" id="publishBtn"><i data-lucide="send"></i>Publish</button></div>
</form></div></div>
<div class="notice-modal" id="noticeModal"><div class="notice-card"><div class="notice-head"><div class="notice-icon"><i data-lucide="info"></i></div><button class="icon-btn" id="noticeClose" type="button" aria-label="Close"><i data-lucide="x"></i></button></div><div class="notice-title" id="noticeTitle"></div><div class="notice-message" id="noticeMessage"></div><button class="notice-action" id="noticeAction" type="button">Close</button></div></div>
<script>
const t=localStorage.getItem('creovah_token');if(!t)location.href='/auth.html';const $=id=>document.getElementById(id);let user=null,items=[],selectedPreview='linkedin',uploadedMedia=null,selectedFile=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function notice(title,msg){$('noticeTitle').textContent=title;$('noticeMessage').textContent=msg;$('noticeModal').classList.add('open')}function closeNotice(){$('noticeModal').classList.remove('open')}$('noticeClose').onclick=closeNotice;$('noticeAction').onclick=closeNotice;
function updateStats(){$('connected').textContent=Object.values(user.socials||{}).filter(Boolean).length;$('scheduledCount').textContent=items.filter(x=>x.status==='scheduled').length;$('publishedCount').textContent=items.filter(x=>x.status==='published').length}
function platformLogo(p){return p==='linkedin'?'<i data-lucide="linkedin"></i>':p==='facebook'?'<i data-lucide="facebook"></i>':p==='instagram'?'<i data-lucide="instagram"></i>':'<i data-lucide="music-2"></i>'}
function connectedPlatforms(){const out=[];if(user?.connections?.linkedin?.connected)out.push('linkedin');if(user?.connections?.facebook?.connected)out.push('facebook');if(user?.connections?.instagram?.connected)out.push('instagram');if(user?.socials?.tiktok)out.push('tiktok');return out}
function renderPlatformChoices(){const box=document.querySelector('.platforms');const list=connectedPlatforms();box.innerHTML=list.length?list.map(p=>`<button type="button" class="platform" data-platform="${p}">${platformLogo(p)}${p[0].toUpperCase()+p.slice(1)}</button>`).join(''):'<div class="platform-empty">No social accounts connected. Connect an account in Settings.</div>';lucide.createIcons();document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{b.classList.toggle('on');updatePreview()})}
function renderContent(){if(!items.length){$('contentList').innerHTML='<div class="empty"><p>No content yet.</p></div>';return}$('contentList').innerHTML=items.map(x=>`<div class="content-item"><div><div class="content-title">${esc(x.title||'Untitled')}</div><div class="content-body">${esc(x.body||'')}</div><div class="meta">${(x.platforms||[]).map(p=>`<span class="pill">${esc(p)}</span>`).join('')}<span class="pill status ${esc(x.status)}">${esc(x.status)}${x.scheduledFor?' · '+new Date(x.scheduledFor).toLocaleString():''}</span></div></div><button class="delete-btn" data-id="${x._id}">Delete</button></div>`).join('');document.querySelectorAll('.delete-btn').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this content?'))return;const r=await fetch('/api/content/'+b.dataset.id,{method:'DELETE',headers:{Authorization:'Bearer '+t}});if(r.ok){items=items.filter(x=>x._id!==b.dataset.id);renderContent();updateStats()}})}
function resetMedia(){if($('mediaImg').src)URL.revokeObjectURL($('mediaImg').src);if($('mediaVideo').src)URL.revokeObjectURL($('mediaVideo').src);$('mediaImg').style.display='none';$('mediaVideo').style.display='none';$('mediaImg').src='';$('mediaVideo').src='';$('mediaPreview').classList.remove('show');$('mediaFile').value='';uploadedMedia=null;selectedFile=null;updatePreview()}
function renderPreviewTabs(platforms){const list=platforms.length?platforms:['linkedin'];if(!list.includes(selectedPreview))selectedPreview=list[0];$('previewSwitch').innerHTML=list.map(p=>`<button class="${p===selectedPreview?'on':''}" data-preview="${p}">${p[0].toUpperCase()+p.slice(1)}</button>`).join('');document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=()=>{selectedPreview=b.dataset.preview;renderPreviewTabs(list);updatePreview()})}
function updatePreview(){const platforms=[...document.querySelectorAll('.platform.on')].map(x=>x.dataset.platform);renderPreviewTabs(platforms);const title=$('title').value.trim(),body=$('body').value.trim(),name=user?.connections?.[selectedPreview]?.name||user?.name||'Profile';let media='';if($('mediaImg').style.display!=='none'&&$('mediaImg').src)media=`<img class="pv-media" src="${esc($('mediaImg').src)}" alt="">`;if($('mediaVideo').style.display!=='none'&&$('mediaVideo').src)media=`<video class="pv-media" src="${esc($('mediaVideo').src)}" controls playsinline></video>`;let header=selectedPreview==='linkedin'?'LinkedIn':selectedPreview==='facebook'?'Facebook':selectedPreview==='instagram'?'Instagram':'TikTok';$('postPreview').innerHTML=`<div class="pv-head"><div class="pv-avatar"><i data-lucide="user"></i></div><div><div class="pv-name">${esc(name)}</div><div class="pv-sub">${header} · Preview</div></div></div><div class="pv-body">${esc(body||title||'')}</div>${title&&body&&selectedPreview==='linkedin'?`<div class="pv-platform-note">${esc(title)}</div>`:''}${media}<div class="pv-actions"><span>Like</span><span>Comment</span><span>Share</span><span>Send</span></div>`;lucide.createIcons()}
$('body').oninput=()=>{$('count').textContent=$('body').value.length;updatePreview()};$('title').oninput=updatePreview;
document.querySelectorAll('.platform').forEach(b=>b.onclick=()=>{b.classList.toggle('on');updatePreview()});
$('mediaFile').onchange=()=>{const f=$('mediaFile').files[0];if(!f)return;if(!/^image\/(jpeg|png|gif)$|^video\/mp4$/.test(f.type))return notice('Unsupported media','Choose a JPG, PNG, GIF or MP4 file.');if(f.size>200*1024*1024)return notice('File too large','Keep the media file under 200 MB.');if($('mediaImg').src)URL.revokeObjectURL($('mediaImg').src);if($('mediaVideo').src)URL.revokeObjectURL($('mediaVideo').src);uploadedMedia=null;selectedFile=f;const url=URL.createObjectURL(f);if(f.type.startsWith('image/')){$('mediaImg').src=url;$('mediaImg').style.display='block'}else{$('mediaVideo').src=url;$('mediaVideo').style.display='block'}$('mediaPreview').classList.add('show');updatePreview()};$('removeMedia').onclick=resetMedia;
function openModal(){resetMedia();$('contentForm').reset();document.querySelectorAll('.platform').forEach(x=>x.classList.remove('on'));$('count').textContent='0';$('formError').textContent='';$('schedule').min=new Date(Date.now()+60000).toISOString().slice(0,16);$('modal').classList.add('open');renderPreviewTabs([]);updatePreview()}function closeModal(){$('modal').classList.remove('open');resetMedia()};$('newPost').onclick=openModal;$('close').onclick=closeModal;$('cancel').onclick=closeModal;
async function uploadMedia(){const f=selectedFile || $('mediaFile').files[0];if(!f)return null;const platforms=[...document.querySelectorAll('.platform.on')].map(x=>x.dataset.platform);if(!platforms.includes('linkedin'))return null;if(uploadedMedia&&uploadedMedia.name===f.name&&uploadedMedia.size===f.size)return uploadedMedia;const fd=new FormData();fd.append('media',f);$('uploadProgress').classList.add('show');$('uploadBar').style.width='25%';const r=await fetch('/api/linkedin/media',{method:'POST',headers:{Authorization:'Bearer '+t},body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Media upload failed.');$('uploadBar').style.width='100%';uploadedMedia={name:f.name,size:f.size,urn:d.urn,type:d.mediaType};setTimeout(()=>$('uploadProgress').classList.remove('show'),400);return uploadedMedia}
async function submitContent(action){$('formError').textContent='';const platforms=[...document.querySelectorAll('.platform.on')].map(x=>x.dataset.platform);if(!platforms.length)return $('formError').textContent='Choose at least one platform.';if(action==='publish'&&!platforms.every(p=>p==='linkedin'))return $('formError').textContent='Publishing is currently available for LinkedIn only.';if((action==='publish'||action==='schedule')&&platforms.includes('linkedin')&&!user.connections.linkedin.connected)return $('formError').textContent='Connect LinkedIn before publishing.';if(action==='schedule'&&!$('schedule').value)return $('formError').textContent='Choose a date and time.';try{const media=await uploadMedia();const payload={title:$('title').value.trim(),body:$('body').value.trim(),platforms,status:action==='schedule'?'scheduled':'draft',publishNow:action==='publish',scheduledFor:action==='schedule'?new Date($('schedule').value).toISOString():null,mediaUrn:media?.urn||'',mediaType:media?.type||'',mediaAltText:$('altText').value.trim()};const r=await fetch('/api/content',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+t},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.message||'Unable to save this content.');items.unshift(d.item);renderContent();updateStats();closeModal();notice(action==='publish'?'Published':action==='schedule'?'Scheduled':'Draft saved',action==='publish'?'The post was published.':action==='schedule'?'The post was scheduled.':'The draft was saved.')}catch(e){$('formError').textContent=e.message||'Unable to complete this action.'}}
$('draftBtn').onclick=()=>submitContent('draft');$('scheduleBtn').onclick=()=>submitContent('schedule');$('publishBtn').onclick=()=>submitContent('publish');
async function load(){try{const [u,c]=await Promise.all([fetch('/api/me',{headers:{Authorization:'Bearer '+t}}),fetch('/api/content',{headers:{Authorization:'Bearer '+t}})]);if(u.status===401)return location.href='/auth.html';const ud=await u.json(),cd=await c.json();user=ud.user;items=cd.items||[];$('menuName').textContent=user.name;renderContent();updateStats();renderPlatformChoices();renderPreviewTabs([]);updatePreview()}catch(e){notice('Unable to load',e.message||'Unable to load the workspace.')}}
const params=new URLSearchParams(location.search);if(params.get('connect')){const status=params.get('connect'),message=params.get('message')||'';if(status==='linkedin-success')notice('LinkedIn connected',message||'LinkedIn is connected.');else if(status==='facebook-success')notice('Facebook connected',message||'Facebook is connected.');else if(status==='instagram-success')notice('Instagram connected',message||'Instagram is connected.');else if(status==='error')notice('Connection failed',message||'The connection was not completed.');history.replaceState(null,'','/dashboard.html')}
$('menuBtn').onclick=e=>{$('menuDropdown').classList.toggle('open');e.stopPropagation()};document.addEventListener('click',e=>{if(!$('menuDropdown').contains(e.target)&&e.target!==$('menuBtn'))$('menuDropdown').classList.remove('open')});$('out').onclick=()=>{localStorage.removeItem('creovah_token');location.href='/'};lucide.createIcons();load();
</script></body></html>
