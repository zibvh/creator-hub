<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — creovah</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/css/auth.css"><script src="https://unpkg.com/lucide@latest"></script><link rel="icon" type="image/png" href="/assets/creovah-logo.png">
<link rel="apple-touch-icon" href="/assets/creovah-logo.png">
<meta name="description" content="Creovah helps creators plan, prepare, schedule and publish content across social platforms from one place.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Creovah">
<meta property="og:title" content="Creovah — one queue, every platform">
<meta property="og:description" content="Plan, prepare, schedule and publish your content across the platforms you use — from one workspace.">
<meta property="og:url" content="https://creovah.onrender.com/">
<meta property="og:image" content="https://creovah.onrender.com/assets/creovah-og.png">
<meta property="og:image:width" content="1536">
<meta property="og:image:height" content="1536">
<meta property="og:image:alt" content="Creovah logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Creovah — one queue, every platform">
<meta name="twitter:description" content="Plan, prepare, schedule and publish your content across social platforms from one workspace.">
<meta name="twitter:image" content="https://creovah.onrender.com/assets/creovah-og.png">
</head>
<body><div class="auth-shell"><a class="brand brand-lockup" href="/"><img class="brand-logo" src="/assets/creovah-logo.png" alt="Creovah"><span>creovah</span></a><main class="auth-card"><div class="auth-mark"><i data-lucide="sparkles"></i></div><h1>Welcome back.</h1><p>Sign in to pick up where you left off.</p><form id="loginForm"><label>Email<input id="email" type="email" autocomplete="email" required placeholder="you@example.com"></label><label>Password<div class="password-wrap"><input id="password" type="password" autocomplete="current-password" required placeholder="Your password"><button type="button" id="toggle"><i data-lucide="eye"></i></button></div></label><div class="form-row"><label class="check-row"><input type="checkbox" id="remember"> <span>Remember me</span></label><a href="#" onclick="return false">Forgot password?</a></div><button class="submit" type="submit">Sign in <i data-lucide="arrow-right"></i></button><div class="error" id="error"></div></form><p class="switch">New to Creovah? <a href="/onboarding/">Create an account</a></p></main><footer>© 2026 creovah</footer></div><script>
const $=id=>document.getElementById(id); lucide.createIcons();
$("toggle").onclick=()=>{const p=$("password");p.type=p.type==="password"?"text":"password";$("toggle").innerHTML=p.type==="password"?'<i data-lucide="eye"></i>':'<i data-lucide="eye-off"></i>';lucide.createIcons()};
$("loginForm").onsubmit=async e=>{e.preventDefault();$("error").textContent="";const btn=e.submitter;btn.disabled=true;try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$("email").value,password:$("password").value})});const d=await r.json();if(!r.ok)throw new Error(d.message);localStorage.setItem("creovah_token",d.token);location.href=d.user?.onboardingCompleted?"/dashboard.html":"/onboarding/"}catch(err){$("error").textContent=err.message}finally{btn.disabled=false}};
</script></body></html>
