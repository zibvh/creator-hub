<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace — creovah</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:#1c1712;font-family:Inter,sans-serif}.top{height:70px;border-bottom:1px solid #e1dcd4;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;position:relative}.brand{font:800 23px Fraunces;letter-spacing:-1.5px}.menu-btn{border:1px solid #e3ded6;background:#fff;border-radius:9px;width:40px;height:40px;cursor:pointer}.menu-btn span,.menu-btn span:before,.menu-btn span:after{display:block;width:16px;height:2px;background:#1c1712;position:relative;margin:auto}.menu-btn span:before,.menu-btn span:after{content:"";position:absolute;left:0}.menu-btn span:before{top:-5px}.menu-btn span:after{top:5px}.menu-dropdown{position:absolute;top:60px;right:20px;background:#fff;border:1px solid #e3ded6;border-radius:12px;box-shadow:0 16px 35px #3b33251a;padding:8px;min-width:200px;display:none;z-index:20}.menu-dropdown.open{display:block}.who{padding:10px 12px;font-size:12px;color:#8a837a;border-bottom:1px solid #f0ece5;margin-bottom:6px}.menu-dropdown a,.menu-dropdown button{display:block;width:100%;text-align:left;border:0;background:none;padding:10px 12px;border-radius:8px;font:600 13px Inter;color:#1c1712;cursor:pointer}.menu-dropdown a:hover,.menu-dropdown button:hover{background:#faf7f2}.signout{color:#e8622d!important}.wrap{max-width:1100px;margin:52px auto;padding:0 25px}.eyebrow{text-transform:uppercase;letter-spacing:1.5px;font-size:10px;font-weight:800;color:#e8622d}.head{display:flex;justify-content:space-between;align-items:end;gap:20px}.head h1{font:800 42px Fraunces;letter-spacing:-2px;margin:12px 0}.new{background:#e8622d;color:#fff;border:0;border-radius:9px;padding:12px 15px;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;margin-top:35px}.card{background:#fff;border:1px solid #e3ded6;border-radius:13px;padding:22px}.card span{font-size:11px;color:#898279}.card strong{display:block;font:800 28px Fraunces;margin-top:8px}.wide{grid-column:1/-1}.wide h2{font:600 18px Fraunces;margin:0 0 8px}.banner{border-radius:10px;padding:14px 18px;font-size:13px;font-weight:600;margin-bottom:20px}.banner.ok{background:#e7f3ea;color:#1f7a3d}.banner.err{background:#fbe9e5;color:#e8622d}.conn-row{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #ede8e0}.conn-row:last-child{border-bottom:0}.conn-left{display:flex;align-items:center;gap:14px}.conn-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:14px}.ig{background:linear-gradient(135deg,#f58529,#dd2a7b,#8134af)}.fb{background:#1877f2}.conn-name{font-weight:700;font-size:14px}.conn-sub{font-size:12px;color:#8a837a;margin-top:2px}.conn-btn,.delete-btn{border:0;border-radius:8px;padding:9px 14px;font-weight:700;font-size:12px;cursor:pointer}.connect{background:#1c1712;color:#fff}.disconnect,.delete-btn{background:#f0ece5;color:#1c1712}.content-list{display:grid;gap:10px}.content-item{border:1px solid #ece6de;border-radius:10px;padding:15px;display:grid;grid-template-columns:1fr auto;gap:12px}.content-title{font-weight:700;font-size:14px}.content-body{font-size:12px;color:#8a837a;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.pill{font-size:10px!important;color:#6e675f!important;background:#f1ede7;padding:5px 7px;border-radius:999px}.status{font-weight:700}.status.scheduled{color:#a05b12}.status.draft{color:#777}.empty{padding:35px 10px;text-align:center;color:#8a837a}.empty p{font-size:13px}.modal{position:fixed;inset:0;background:#1c171255;display:none;align-items:center;justify-content:center;padding:18px;z-index:50}.modal.open{display:flex}.modal-card{width:min(560px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 20px 60px #0002}.modal-head{display:flex;justify-content:space-between;align-items:start}.modal h2{font:700 25px Fraunces;margin:0}.close{border:0;background:#f0ece5;width:34px;height:34px;border-radius:50%;cursor:pointer}.field{margin-top:18px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:7px}.field input,.field textarea{width:100%;border:1px solid #dcd6ce;border-radius:9px;padding:12px;font:inherit;outline:none}.field textarea{min-height:120px;resize:vertical}.field input:focus,.field textarea:focus{border-color:#e8622d;box-shadow:0 0 0 3px #e8622d14}.checks{display:flex;gap:8px;flex-wrap:wrap}.check{border:1px solid #ddd8d0;background:#fff;border-radius:9px;padding:9px 12px;font-size:12px;font-weight:600;cursor:pointer}.check.on{border-color:#e8622d;background:#f8eee9}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}.secondary{border:0;background:#f0ece5;border-radius:9px;padding:12px 15px;font-weight:700;cursor:pointer}.error{color:#b42f28;font-size:12px;margin-top:10px;min-height:17px}@media(max-width:700px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column}.wrap{margin-top:40px}.content-item{grid-template-columns:1fr}.delete-btn{justify-self:start}}
</style></head><body><header class="top"><span class="brand">creovah</span><button class="menu-btn" id="menuBtn" aria-label="Menu"><span></span></button><div class="menu-dropdown" id="menuDropdown"><div class="who" id="menuName"></div><a href="/settings.html">Settings</a><a href="/privacy.html">Privacy Policy</a><button class="signout" id="out">Sign out</button></div></header><main class="wrap"><div id="banner"></div><div class="head"><div><span class="eyebrow">Workspace</span><h1>Your publishing home.</h1></div><button class="new" id="newPost">Create content</button></div><div class="grid"><div class="card"><span>Scheduled</span><strong id="scheduledCount">0</strong></div><div class="card"><span>Published</span><strong id="publishedCount">0</strong></div><div class="card"><span>Connected platforms</span><strong id="connected">0</strong></div><div class="card wide"><h2>Connections</h2><div id="connRows"></div></div><div class="card wide"><h2>Upcoming content</h2><div id="contentList" class="content-list"></div></div></div></main>
<div class="modal" id="modal"><div class="modal-card"><div class="modal-head"><div><span class="eyebrow">New content</span><h2>Create a post.</h2></div><button class="close" id="close">×</button></div><form id="contentForm"><div class="field"><label for="title">Title</label><input id="title" maxlength="120" required placeholder="e.g. Week 4 build-in-public"></div><div class="field"><label for="body">Caption / content</label><textarea id="body" maxlength="5000" placeholder="Write what you want to publish..."></textarea></div><div class="field"><label>Platforms</label><div class="checks"><button type="button" class="check" data-platform="instagram">Instagram</button><button type="button" class="check" data-platform="facebook">Facebook</button><button type="button" class="check" data-platform="tiktok">TikTok</button></div></div><div class="field"><label for="schedule">Schedule (optional)</label><input id="schedule" type="datetime-local"></div><div class="error" id="formError"></div><div class="actions"><button type="button" class="secondary" id="cancel">Cancel</button><button class="new" type="submit">Save content</button></div></form></div></div>
<script>
const t=localStorage.getItem("creovah_token");if(!t)location.href="/auth.html";const $=id=>document.getElementById(id);let user=null,items=[];
function banner(kind,msg){$("banner").innerHTML=`<div class="banner ${kind}">${msg}</div>`;setTimeout(()=>{$("banner").innerHTML=""},4500)}
function renderConnections(){const rows=[{key:"instagram",cls:"ig",label:"Instagram",sub:user.connections.instagram.connected?"@"+(user.connections.instagram.igUsername||"connected"):"Publish and manage your Instagram Business account"},{key:"facebook",cls:"fb",label:"Facebook",sub:user.connections.facebook.connected?(user.connections.facebook.pageName||"connected"):"Publish to your Facebook Page"}];$("connRows").innerHTML=rows.map(r=>{const c=user.connections[r.key].connected;return `<div class="conn-row"><div class="conn-left"><div class="conn-icon ${r.cls}">${r.label[0]}</div><div><div class="conn-name">${r.label}</div><div class="conn-sub">${r.sub}</div></div></div><button class="conn-btn ${c?"disconnect":"connect"}" data-platform="${r.key}">${c?"Disconnect":"Connect"}</button></div>`}).join("");document.querySelectorAll(".conn-btn").forEach(b=>b.onclick=async()=>{
  if(b.classList.contains("connect")){
    b.disabled=true;
    try{
      const r=await fetch("/api/connections/facebook/start",{headers:{Authorization:"Bearer "+t}});
      const d=await r.json();
      if(!r.ok) throw new Error(d.message||"Unable to start the Facebook connection.");
      if(!d.url) throw new Error("Facebook did not provide an authorization URL.");
      location.href=d.url;
    }catch(e){
      banner("err",e.message||"Unable to connect Facebook right now.");
      b.disabled=false;
    }
    return;
  }
  b.disabled=true;
  try{
    const r=await fetch("/api/connections/"+b.dataset.platform+"/disconnect",{method:"POST",headers:{Authorization:"Bearer "+t}});
    const d=await r.json();
    if(!r.ok) throw new Error(d.message||"Unable to disconnect right now.");
    if(d.user){user=d.user;renderConnections();updateStats()}else throw new Error("Unable to disconnect right now.");
  }catch(e){banner("err",e.message);b.disabled=false}
})}
function updateStats(){$("connected").textContent=Object.values(user.socials||{}).filter(Boolean).length;$("scheduledCount").textContent=items.filter(x=>x.status==="scheduled").length;$("publishedCount").textContent=items.filter(x=>x.status==="published").length}
function renderContent(){if(!items.length){$("contentList").innerHTML='<div class="empty"><p>Your calendar is clear. Create your first piece of content to start building your queue.</p><button class="new" onclick="openModal()">Add your first post</button></div>';return}$("contentList").innerHTML=items.map(x=>`<div class="content-item"><div><div class="content-title">${esc(x.title)}</div><div class="content-body">${esc(x.body||"No caption yet")}</div><div class="meta">${x.platforms.map(p=>`<span class="pill">${p}</span>`).join("")}<span class="pill status ${x.status}">${x.status}${x.scheduledFor?" · "+new Date(x.scheduledFor).toLocaleString():""}</span></div></div><button class="delete-btn" data-id="${x._id}">Delete</button></div>`).join("");document.querySelectorAll(".delete-btn").forEach(b=>b.onclick=async()=>{if(!confirm("Delete this content?"))return;const r=await fetch("/api/content/"+b.dataset.id,{method:"DELETE",headers:{Authorization:"Bearer "+t}});if(r.ok){items=items.filter(x=>x._id!==b.dataset.id);renderContent();updateStats()}})}
function esc(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
async function load(){try{const [u,c]=await Promise.all([fetch("/api/me",{headers:{Authorization:"Bearer "+t}}),fetch("/api/content",{headers:{Authorization:"Bearer "+t}})]);if(u.status===401)return location.href="/auth.html";const ud=await u.json(),cd=await c.json();user=ud.user;items=cd.items||[];$("menuName").textContent=user.name;renderConnections();renderContent();updateStats()}catch{banner("err","Unable to load your workspace right now.")}}
const modal=$("modal");function openModal(){modal.classList.add("open");$("title").focus()}function closeModal(){modal.classList.remove("open");$("contentForm").reset();document.querySelectorAll(".check").forEach(x=>x.classList.remove("on"));$("formError").textContent=""}window.openModal=openModal;$("newPost").onclick=openModal;$("close").onclick=closeModal;$("cancel").onclick=closeModal;modal.onclick=e=>{if(e.target===modal)closeModal()};document.querySelectorAll(".check").forEach(b=>b.onclick=()=>b.classList.toggle("on"));
$("contentForm").onsubmit=async e=>{e.preventDefault();$("formError").textContent="";const platforms=[...document.querySelectorAll(".check.on")].map(x=>x.dataset.platform);const scheduled=$("schedule").value;const r=await fetch("/api/content",{method:"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+t},body:JSON.stringify({title:$("title").value,body:$("body").value,platforms,status:scheduled?"scheduled":"draft",scheduledFor:scheduled?new Date(scheduled).toISOString():null})});const d=await r.json();if(!r.ok)return $("formError").textContent=d.message||"Unable to save.";items.unshift(d.item);items.sort((a,b)=>new Date(a.scheduledFor||a.createdAt)-new Date(b.scheduledFor||b.createdAt));renderContent();updateStats();closeModal();banner("ok",scheduled?"Content scheduled in your workspace.":"Draft saved to your workspace.")};
const params=new URLSearchParams(location.search);if(params.get("connect")){const status=params.get("connect"),reasons={denied:"You cancelled the connection request.","session-expired":"That connection request expired — please try again.","no-pages-found":"No Facebook Pages were found on that account.","account-not-found":"Account not found.",unexpected:"Something went wrong connecting your account."};banner(status.includes("success")?"ok":"err",status==="instagram-success"?"Instagram connected successfully.":status==="facebook-only-success"?"Facebook connected. No Instagram Business account was found on that Page.":reasons[params.get("reason")]||"Unable to connect.");history.replaceState(null,"","/dashboard.html")}
$("menuBtn").onclick=e=>{$("menuDropdown").classList.toggle("open");e.stopPropagation()};document.addEventListener("click",e=>{if(!$('menuDropdown').contains(e.target)&&e.target!==$('menuBtn'))$('menuDropdown').classList.remove('open')});$("out").onclick=()=>{localStorage.removeItem("creovah_token");location.href="/"};load();
</script></body></html>
